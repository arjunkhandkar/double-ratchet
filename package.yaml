name:         double-ratchet
version:      0.1.0
synopsis:     A double ratchet implementation parameterized over your choice of KDFs
description:  This package provides a state machine that implements a version of the double ratchet algorithm. While it may not be completely faithful to the implementation used by Signal and WhatsApp (among others), it should be sufficient to power toy projects, or simply as a tool to learn how the algorithm works.
stability:    experimental
author:       Arjun Khandkar
copyright:    (c) 2026 Arjun Khandkar

language: GHC2021

default-extensions:
  - AllowAmbiguousTypes
  - RecordWildCards
  - TemplateHaskell
  - TypeFamilies

dependencies:
  - base
  - containers
  - mtl
  - random
  - text
  - HUnit
  - hspec
  - hedgehog

ghc-options:
- -Wall
- -Werror
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints
- -Wno-unticked-promoted-constructors

library:
  source-dirs: src

  exposed-modules:
    DoubleRatchet
    DoubleRatchet.Class
    DoubleRatchet.RatchetM
    DoubleRatchet.State
    Test.TestMain

  other-modules:
    Test.Implementation
    Test.ToyCrypto

tests:
  state-machine-spec:
    main: Main.hs
    source-dirs: test
    dependencies:
      - double-ratchet
      - hspec
