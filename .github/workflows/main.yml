name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Update Stackage index
        run: stack update

      - name: Build
        run: stack build

      - name: Test
        run: stack test

      - name: Upload Stack build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stack-build
          path: .stack-work
