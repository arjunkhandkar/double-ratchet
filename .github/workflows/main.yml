name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Update Stackage index
        run: stack update

      - name: Build
        run: stack build

      - name: Test
        run: stack test

      - name: Upload Stack build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stack-build
          path: .stack-work

  docs:
    name: Haddock
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Update Hackage index
        run: stack update

      - name: Build Haddocks
        run: stack haddock --haddock-arguments "--base-url=https://arjunkhandkar.github.io/double-ratchet/haddock/"

      - name: Prepare Pages artifact
        run: |
          mkdir -p pages/haddock
          cp -r "$(stack path --local-doc-root)"/* pages/haddock/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
