name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Update Stackage index
        run: stack update

      - name: Build
        run: stack build --test --no-run-tests

      - name: Upload Stack build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stack-build
          path: .stack-work

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Download Stack build artifacts
        uses: actions/download-artifact@v4
        with:
          name: stack-build
          path: .stack-work

      - name: Test
        run: stack test
